<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card p-4" style="width: 420px;">
      <h4 class="mb-3 text-center">Create an account</h4>
      <div id="error" class="alert alert-danger d-none"></div>
      <div id="success" class="alert alert-success d-none"></div>
      <form id="registerForm">
        <div class="mb-3">
          <label class="form-label">I am a</label>
          <select id="role" class="form-select">
            <option value="student">Student</option>
            <option value="company">Company</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input type="text" id="name" class="form-control" required />
        </div>
        <div class="mb-3" id="companyNameField" style="display:none;">
          <label class="form-label">Company name</label>
          <input type="text" id="companyName" class="form-control" />
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" id="email" class="form-control" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-control" minlength="6" required />
        </div>
        <button type="submit" class="btn btn-primary w-100">Register</button>
      </form>
      <p class="text-center mt-3 mb-0">
        Already have an account? <a href="index.html">Login</a>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
